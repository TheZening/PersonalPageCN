{{/* MathJax 3 with the physics and mathtools extensions used throughout the notes. */}}
{{/* Wick contractions: \wick{AB}; nest \wick{A\wick{BC}D} for nested contractions. */}}
<script>
  window.MathJax = {
    loader: {
      load: ["ui/safe", "[tex]/physics", "[tex]/mathtools"]
    },
    tex: {
      packages: {
        "[+]": ["physics", "mathtools"]
      },
      displayMath: [
        ["\\[", "\\]"],
        ["$$", "$$"]
      ],
      inlineMath: [
        ["\\(", "\\)"],
        ["$", "$"]
      ],
      processEscapes: true,
      macros: {
        bm: ["\\boldsymbol{#1}", 1],
        slashed: ["\\not{#1}", 1],
        wick: ["\\overbracket{#1}", 1]
      }
    }
  };
</script>
<script
  defer
  async
  id="MathJax-script"
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
  crossorigin="anonymous">
</script>
